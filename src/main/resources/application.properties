spring.application.name=sacm

# Conexão com o MySQL. Usuário e senha vêm de variáveis de ambiente (nunca grave senha real aqui).
spring.datasource.url=jdbc:mysql://localhost:3306/sacm_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Se o banco cair, o erro aparece em 5 s em vez de 30 s (útil na demonstração de falha técnica).
spring.datasource.hikari.connection-timeout=5000

# Aplicação de console: sem banner e com log enxuto no terminal.
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.br.edu.avaliacao.sacm=INFO

# Detalhes técnicos (stack trace completo) também ficam gravados em arquivo para diagnóstico.
logging.file.name=logs/sacm.log
